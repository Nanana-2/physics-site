site_name: 大学物理の問題集
site_url: https://nanana-2.github.io/physics-site/
theme:
  name: material
  custom_dir: overrides
  language: ja   # 目次などの見出しを日本語に
  logo: assets/logo.svg       # ベクトル n に★（ななな２の n，★に向かって進む）
  favicon: assets/favicon.svg
  font: false   # フォントは overrides/main.html で必要な太さ（400・700）だけ読み込む
  features:
    - content.code.copy 
    - navigation.path   # 問題ページの上にパンくず（分野 › 章）を出す
    - navigation.tabs        # ヘッダーの2段目に分野のタブを出す（サイドバーは今いる分野だけになる）
    - navigation.tabs.sticky # スクロールしてもタブを残す
    - navigation.top         # 少し戻るスクロールをすると「ページの先頭へ」ボタンを出す
    # - navigation.expand # ★これを追加！初期状態でサイドバーの各章を折りたたみます
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: ダークモードに切り替え

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: ライトモードに切り替え

extra:
  analytics:
    provider: google
    property: G-FDK0HJQRC9

markdown_extensions:
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


extra_javascript:
  - javascripts/mathjax.js?v=20261021d
  - javascripts/problem-filter.js?v=20261021d
  - javascripts/share.js?v=20261021d
  - javascripts/tabs.js?v=20261021d
  - javascripts/site-search.js?v=20261021d
  - javascripts/answers.js?v=20261021d
  - javascripts/copy-markdown.js?v=20261021d
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

hooks:
  - hooks/problem_layout.py
  - hooks/problem_index.py
  - hooks/seo_metadata.py
  - hooks/subject_sitemaps.py

not_in_nav: |
  tag-index.md

plugins:
  - awesome-pages
  - tags:
      tags_file: tag-index.md
                  


extra_css:
  - stylesheets/extra.css?v=20261021d
