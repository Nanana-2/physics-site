# main に変更が入るたびに，サイトをビルドして gh-pages ブランチに公開する。
# 手元の `mkdocs gh-deploy` と同じことを GitHub 上で行う。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.6 mkdocs-awesome-pages-plugin==2.10.1 pymdown-extensions==10.21.3
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - name: Build and deploy
        run: python -m mkdocs gh-deploy --force --no-history
